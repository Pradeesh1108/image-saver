[project]
name = "backend"
version = "0.1.0"
description = "Instagram Image Downloader - FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "browser-cookie3>=0.20.1",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "instaloader>=4.15.2",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "uvicorn>=0.51.0",
]

[project.scripts]
dev = "uvicorn main:app --reload --host 0.0.0.0 --port 8000"

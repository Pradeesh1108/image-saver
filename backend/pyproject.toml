[project]
name = "backend"
version = "0.1.0"
description = "Instagram Image Downloader - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "uvicorn>=0.51.0",
]

[project.scripts]
dev = "uvicorn main:app --reload --host 0.0.0.0 --port 8000"
